# Code PushUp Azure DevOps Pipeline Template
#
# Usage: Include this template in your azure-pipelines.yml:
#
#   resources:
#     repositories:
#       - repository: code-pushup
#         type: github
#         name: code-pushup/cli
#         endpoint: github-service-connection
#
#   stages:
#     - template: packages/azure-devops-ci/azure-pipelines-template.yml@code-pushup
#       parameters:
#         token: $(System.AccessToken)
#
# Or copy this template into your repo and reference it directly:
#
#   stages:
#     - template: .azure/code-pushup.yml
#       parameters:
#         token: $(System.AccessToken)

parameters:
  - name: token
    type: string
    displayName: 'Azure DevOps API Token'
    default: '$(System.AccessToken)'

  - name: nodeVersion
    type: string
    displayName: 'Node.js version'
    default: '22.x'

  - name: bin
    type: string
    displayName: 'Code PushUp CLI executable'
    default: 'npx --no-install @code-pushup/cli'

  - name: config
    type: string
    displayName: 'Config file path'
    default: ''

  - name: directory
    type: string
    displayName: 'Working directory'
    default: ''

  - name: silent
    type: boolean
    displayName: 'Silent mode'
    default: false

  - name: skipComment
    type: boolean
    displayName: 'Skip PR comment'
    default: false

  - name: detectNewIssues
    type: boolean
    displayName: 'Detect new issues'
    default: true

  - name: monorepo
    type: boolean
    displayName: 'Enable monorepo mode'
    default: false

  - name: monorepoTool
    type: string
    displayName: 'Monorepo tool'
    default: ''
    values:
      - ''
      - auto
      - nx
      - turbo
      - yarn
      - pnpm
      - npm

  - name: monorepoParallel
    type: boolean
    displayName: 'Parallel execution'
    default: false

  - name: monorepoParallelMax
    type: string
    displayName: 'Max parallel tasks'
    default: ''

  - name: monorepoProjects
    type: string
    displayName: 'Project filter (comma-separated)'
    default: ''

  - name: monorepoTask
    type: string
    displayName: 'Monorepo task name'
    default: 'code-pushup'

  - name: nxProjectsFilter
    type: string
    displayName: 'Nx projects filter'
    default: ''

  - name: customSourceRef
    type: string
    displayName: 'Custom source ref'
    default: ''

  - name: customTargetRef
    type: string
    displayName: 'Custom target ref'
    default: ''

  - name: configPatterns
    type: string
    displayName: 'Config patterns (JSON)'
    default: ''

  - name: searchCommits
    type: boolean
    displayName: 'Search commits for baseline'
    default: false

  - name: searchCommitsMax
    type: string
    displayName: 'Max commits to search'
    default: '10'

stages:
  - stage: CodePushUp
    displayName: 'Code PushUp Analysis'
    jobs:
      - job: CodePushUp
        displayName: 'Run Code PushUp'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '${{ parameters.nodeVersion }}'
            displayName: 'Install Node.js'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx --yes @code-pushup/azure-devops-ci
            displayName: 'Run Code PushUp'
            env:
              CP_AZURE_TOKEN: ${{ parameters.token }}
              CP_BIN: ${{ parameters.bin }}
              CP_CONFIG: ${{ parameters.config }}
              CP_DIRECTORY: ${{ parameters.directory }}
              CP_SILENT: ${{ parameters.silent }}
              CP_SKIP_COMMENT: ${{ parameters.skipComment }}
              CP_DETECT_NEW_ISSUES: ${{ parameters.detectNewIssues }}
              CP_MONOREPO: ${{ parameters.monorepo }}
              CP_MONOREPO_TOOL: ${{ parameters.monorepoTool }}
              CP_MONOREPO_PARALLEL: ${{ parameters.monorepoParallel }}
              CP_MONOREPO_PARALLEL_MAX: ${{ parameters.monorepoParallelMax }}
              CP_MONOREPO_PROJECTS: ${{ parameters.monorepoProjects }}
              CP_MONOREPO_TASK: ${{ parameters.monorepoTask }}
              CP_MONOREPO_NX_PROJECTS_FILTER: ${{ parameters.nxProjectsFilter }}
              CP_CUSTOM_SOURCE_REF: ${{ parameters.customSourceRef }}
              CP_CUSTOM_TARGET_REF: ${{ parameters.customTargetRef }}
              CP_CONFIG_PATTERNS: ${{ parameters.configPatterns }}
              CP_SEARCH_COMMITS: ${{ parameters.searchCommits }}
              CP_SEARCH_COMMITS_MAX: ${{ parameters.searchCommitsMax }}

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '.code-pushup/.ci'
              artifact: 'code-pushup'
            displayName: 'Publish Code PushUp artifacts'
            condition: always()
